[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tpl-deploy"
version = "0.1.4"
description = "tpl CLI placeholder"
authors = [{ name="Alexandru Croicu", email="cacroi18@outlook.com" }]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.31",
    "truststore>=0.9; python_version >= '3.10'",
]

[project.scripts]
tpl = "tpl_deploy.cli:main"

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "twine>=5,<6",
    "ruff>=0.3,<1",
    "pytest>=8,<9",
    "platformdirs>=4.0"
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tpl_deploy = ["defaults.json"]
